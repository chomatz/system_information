---

- name: ensure tasks run only on selected os releases
  block:

    - name: ensure tasks run only on selected os releases
      block:

        - name: enable CodeReady Linux Builder repository
          ansible.builtin.command:
            cmd: dnf config-manager --set-enabled crb

        - name: enable epel repositories
          ansible.builtin.package:
            name: "{{ item }}"
            state: present
          loop:
            - epel-release
            - epel-next-release
          register: epel_repos
          failed_when:
            - epel_repos is failed
            - "'Failed to install some of the specified packages' not in epel_repos.msg"
            - "'Unable to find a match' not in epel_repos.msg"

        - name: display repo provisioning result
          ansible.builtin.debug:
            var: epel_repos
            verbosity: 1

      when: ansible_distribution == "Rocky"

    - name: install fastfetch
      ansible.builtin.package:
        name: fastfetch
        state: present
      when: ansible_distribution != "Bazzite"

    - name: locate fastfetch binary
      ansible.builtin.command:
        cmd: which fastfetch --skip-alias
      changed_when: false
      register: fastfetch_binary

    - name: run fastfetch on user login
      ansible.builtin.template:
        src: fastfetch.sh.j2
        dest: /etc/profile.d/fastfetch.sh
        owner: root
        group: root
        mode: "0644"

  when: >
    ansible_distribution == "Archlinux" or
    ansible_distribution == "Bazzite" or
    ansible_distribution == "Fedora" or
    ansible_distribution == "RedHat" or
    ansible_distribution == "Rocky"

...
